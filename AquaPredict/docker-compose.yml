version: '3.8'

services:
  api:
    build: .
    container_name: aquapredict_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Africa/Cairo
    restart: unless-stopped

  dashboard:
    build: .
    container_name: aquapredict_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - API_BASE_URL=http://api:8000/api/v1
      - PYTHONUNBUFFERED=1
      - TZ=Africa/Cairo
    depends_on:
      - api
    restart: unless-stopped
